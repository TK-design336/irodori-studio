[package]
name = "irodori-studio"
version = "0.6.0"
description = "Irodori Studio — speaker embedding training & OPT generation"
authors = ["you"]
edition = "2021"

[lib]
name = "irodori_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
sherpa-windows-prebuilt-guard = { path = "../crates/sherpa-windows-prebuilt-guard" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
uuid = { version = "1.24.0", features = ["v4"] }
tokio = { version = "1.53.1", features = ["full"] }
parking_lot = "0.12.5"
dirs = "6.0.0"
which = "8.0.5"
trash = "5.2.6"
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = "0.5"
http = "1"
bytes = "1"
log = "0.4"
anyhow = "1.0"
cpal = "0.17.3"
dasp_sample = "0.11.0"
rubato = "1.0.1"
hound = "3.5.1"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "json", "stream"], default-features = false }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-24"] }
sherpa-onnx = { version = "=1.12.39", default-features = false, features = ["shared"] }
sherpa-onnx-sys = { version = "=1.12.39", default-features = false, features = ["shared"] }

